[project]
name = "campusrecruitmentapi"
version = "0.1.0"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-marshmallow>=1.2.0",
    "marshmallow-sqlalchemy>=1.0.0",
    "flask-migrate>=4.0.5",
    "flask-jwt-extended>=4.6.0",
    "flask-cors>=4.0.0",
    "flasgger>=0.9.7.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.1",
    "pytest>=8.0.0",
    "pytest-flask>=1.3.0"
]

[tool.vercel]
entrypoint = "run:app"
